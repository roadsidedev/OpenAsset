specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  # MarketFactory - Index all markets created
  - kind: ethereum/contract
    name: MarketFactory
    network: mainnet
    source:
      address: "0x..." # Will be replaced during deployment
      abi: MarketFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
        - MarketFactory
        - FactoryStats
      abis:
        - name: MarketFactory
          file: ./abis/MarketFactory.json
        - name: LendingMarket
          file: ./abis/LendingMarket.json
      eventHandlers:
        - event: MarketCreated(indexed address,indexed address,indexed address,address,uint8,uint256,uint256)
          handler: handleMarketCreated
        - event: StablecoinAdded(indexed address,uint8)
          handler: handleStablecoinAdded
        - event: MarketDeactivated(indexed address)
          handler: handleMarketDeactivated
      file: ./src/market-factory.ts

templates:
  # LendingMarket template - Instantiated for each market
  - kind: ethereum/contract
    name: LendingMarket
    network: mainnet
    source:
      abi: LendingMarket
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
        - Loan
        - Liquidity
        - User
      abis:
        - name: LendingMarket
          file: ./abis/LendingMarket.json
        - name: LoanContract
          file: ./abis/LoanContract.json
      eventHandlers:
        - event: LiquidityDeposited(indexed address,uint256,uint256)
          handler: handleLiquidityDeposited
        - event: LiquidityWithdrawn(indexed address,uint256,uint256)
          handler: handleLiquidityWithdrawn
        - event: LoanCreated(indexed address,indexed address,uint256)
          handler: handleLoanCreated
        - event: CircuitBreakerTriggered(uint256,uint256)
          handler: handleCircuitBreakerTriggered
      file: ./src/lending-market.ts

  # LoanContract template - Instantiated for each loan
  - kind: ethereum/contract
    name: LoanContract
    network: mainnet
    source:
      abi: LoanContract
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Loan
        - Liquidation
        - User
      abis:
        - name: LoanContract
          file: ./abis/LoanContract.json
      eventHandlers:
        - event: LoanRepaid(indexed address,uint256,uint256)
          handler: handleLoanRepaid
        - event: LoanLiquidated(indexed address,indexed address,uint256,uint256,uint256)
          handler: handleLoanLiquidated
      file: ./src/loan-contract.ts
